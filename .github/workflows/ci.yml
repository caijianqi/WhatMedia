name: CI & Docker Build

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
    branches: [main, master]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

permissions:
  contents: read
  packages: write

jobs:
  # ── x86_64：GitHub 托管 runner ──────────────────────────────
  rust-amd64:
    name: Rust (linux/amd64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      # openapi feature 下的标注只在打开时才编译，必须单独跑一遍，
      # 否则"契约标注写坏了"要等到有人执行 make openapi 才发现。
      - name: Clippy (openapi)
        run: cargo clippy --workspace --all-targets --features openapi -- -D warnings
      - name: Test
        run: cargo test --workspace
      - name: Test (openapi)
        run: cargo test --workspace --features openapi
      - name: Smoke (healthz)
        run: |
          cargo build -p whatmedia
          ./target/debug/whatmedia serve & SRV=$!
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8080/healthz && break || sleep 1
          done
          curl -fsS http://127.0.0.1:8080/healthz | grep -q '"status":"ok"'
          kill $SRV

  # ── 前端契约与类型 ─────────────────────────────────────────
  # 前后端类型漂移是静默的，所以这条门禁专门守它：
  # 契约与生成物都得和代码同步，不许只改一边。
  contract:
    name: Contract (OpenAPI ↔ 前端类型)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install client deps
        working-directory: client
        run: npm install --ignore-scripts
      - name: Contract is in sync
        run: make openapi-check

  # ── ARM64：自托管 runner（可选/条件运行）────────────────────
  # 仅当配置了对应 self-hosted runner 标签时运行，避免无自建 runner 时阻塞主流水线
  rust-arm64:
    name: Rust (linux/arm64 · self-hosted R5S)
    runs-on: [self-hosted, linux, arm64]
    if: false # 默认按需开启自托管 runner 测试
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --workspace
      - name: Smoke (healthz)
        run: |
          cargo build -p whatmedia
          ./target/debug/whatmedia serve & SRV=$!
          for i in $(seq 1 60); do
            curl -fsS http://127.0.0.1:8080/healthz && break || sleep 1
          done
          curl -fsS http://127.0.0.1:8080/healthz | grep -q '"arch":"aarch64"'
          kill $SRV

  # ── Docker 多架构镜像（GitHub Actions + Docker Buildx）───────
  docker:
    name: Docker Buildx (amd64 + arm64)
    runs-on: ubuntu-latest
    needs: [rust-amd64, contract]
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push multi-arch image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
