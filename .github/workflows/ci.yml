name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  # ── x86_64：GitHub 托管 runner ──────────────────────────────
  rust-amd64:
    name: Rust (linux/amd64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --workspace
      - name: Smoke (healthz)
        run: |
          cargo build --bin mosaic-server
          ./target/debug/mosaic-server & SRV=$$!
          for i in $$(seq 1 30); do
            curl -fsS http://127.0.0.1:8080/healthz && break || sleep 1
          done
          curl -fsS http://127.0.0.1:8080/healthz | grep -q '"status":"ok"'
          kill $$SRV

  # ── ARM64：自托管 runner（R5S / RK3588S）─────────────────────
  # 它慢，但它真实 —— 交叉编译发现不了的坑它会发现。
  rust-arm64:
    name: Rust (linux/arm64 · self-hosted R5S)
    runs-on: [self-hosted, linux, arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --workspace
      - name: Smoke (healthz)
        run: |
          cargo build --bin mosaic-server
          ./target/debug/mosaic-server & SRV=$$!
          for i in $$(seq 1 60); do
            curl -fsS http://127.0.0.1:8080/healthz && break || sleep 1
          done
          curl -fsS http://127.0.0.1:8080/healthz | grep -q '"arch":"aarch64"'
          kill $$SRV

  # ── Docker 多架构镜像 ───────────────────────────────────────
  docker:
    name: Docker (amd64 + arm64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Build multi-arch
        uses: docker/build-push-action@v6
        with:
          platforms: linux/amd64,linux/arm64
          push: false
          tags: ghcr.io/mosaic-media/mosaic:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
