[workspace]
resolver = "2"
members = [
    "crates/*",
    "apps/*",
]
# client / plugins 是 Tauri 工程，有各自的 workspace，不参与本 workspace
exclude = ["client", "plugins", "runtime", "test-media"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.98"
license = "MIT OR Apache-2.0"
repository = "https://github.com/whatmedia/whatmedia"

[workspace.dependencies]
whatmedia-core = { path = "crates/core" }
whatmedia-config = { path = "crates/config" }
whatmedia-database = { path = "crates/database" }
whatmedia-task = { path = "crates/task" }
whatmedia-diagnostics = { path = "crates/diagnostics" }
whatmedia-media = { path = "crates/media" }
whatmedia-metadata = { path = "crates/metadata" }
whatmedia-storage = { path = "crates/storage" }
whatmedia-library = { path = "crates/library" }
whatmedia-scanner = { path = "crates/scanner" }
whatmedia-api = { path = "crates/api" }

tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "time", "sync", "fs", "net", "process", "rt", "io-util"] }
axum = { version = "0.8", features = ["macros"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["trace", "cors", "compression-gzip"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
thiserror = "2"
anyhow = "1"
async-trait = "0.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
uuid = { version = "1", features = ["v4", "v5", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }

# ── 数据层 ──────────────────────────────────────────────
# sqlite-bundled：自带 sqlite3 C 源码，避免依赖目标机上的系统库。
# 这对 arm64 交叉构建是必需的（Docker buildx 里没有 pkg-config）。
sqlx = { version = "0.9", default-features = false, features = [
    "runtime-tokio",
    "sqlite",
    "sqlite-bundled",
    "migrate",
    "derive",
    "chrono",
    "uuid",
    "json",
] }

# ── 文本处理 ────────────────────────────────────────────
# ── OpenAPI（P4-2）────────────────────────────────────────
# 只在 `openapi` feature 下启用：core 必须保持零依赖，
# 不能让"生成契约"这件事给所有下游加上一个编译期依赖。
utoipa = { version = "5", features = ["chrono", "uuid"] }

regex = "1"
roxmltree = "0.21"

# ── 并发控制 ────────────────────────────────────────────
tokio-util = "0.7"

# ── HTTP（元数据 Provider 用）────────────────────────────────
# default-features = false + rustls：不依赖目标机上的 OpenSSL，
# 这对 arm64 交叉构建和 slim 镜像是必需的。
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "gzip"] }

# ── 图片缓存键 / 指纹 ────────────────────────────────────────
sha2 = "0.10"
tempfile = "3"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true
