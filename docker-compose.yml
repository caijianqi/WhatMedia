# WhatMedia 家庭部署模板（x86_64 / ARM64 通用）
#
# 使用方式：
#   docker compose up -d
#
# 注意事项：
#   1. **PUID/PGID 与权限**：
#      镜像默认以内置用户 whatmedia (uid 1000, gid 1000) 运行。
#      宿主机挂载目录（./config, ./data, ./cache, ./logs）建议确保 uid 1000 可读写。
#   2. **媒体目录只读挂载**（:ro）：
#      WhatMedia 服务端仅需要读取媒体，只读挂载更安全（防误删）。
#   3. **硬件编解码直通**（按需取消对应注释）：
#      - Intel / AMD 核显：开启 /dev/dri
#      - Rockchip RK3588：开启 /dev/dri, /dev/mpp_service, /dev/rga
#      - NVIDIA GPU：配置 deploy.resources.reservations.devices

services:
  whatmedia:
    image: ghcr.io/whatmedia/whatmedia:latest
    container_name: whatmedia
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      WHATMEDIA_LOG_LEVEL: info
      WHATMEDIA_LOG_FORMAT: json
      WHATMEDIA_DATABASE_URL: sqlite:/config/whatmedia.db?mode=rwc
      TZ: Asia/Shanghai
    volumes:
      - ./config:/config
      - ./data:/data
      - ./cache:/cache
      - ./logs:/logs
      # 媒体目录：请替换为宿主机实际路径，保持 :ro 只读
      - /path/to/media:/media:ro
    # ── 硬件直通示例（按需选择解开注释）────────────────────────
    # 选项 A: Intel QSV / AMD VAAPI（常见 x86 小主机、NAS、NUC）
    # devices:
    #   - /dev/dri:/dev/dri
    #
    # 选项 B: Rockchip RK3588（R5S / R6S / 树莓派香橙派等）
    # devices:
    #   - /dev/dri:/dev/dri
    #   - /dev/mpp_service:/dev/mpp_service
    #   - /dev/rga:/dev/rga
    #
    # 选项 C: NVIDIA GPU（需宿主机安装 nvidia-container-toolkit）
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
