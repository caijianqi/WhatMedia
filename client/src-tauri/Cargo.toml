[package]
name = "mosaic-client"
version = "0.1.0"
description = "Mosaic 跨平台客户端外壳"
edition = "2021"
rust-version = "1.98"

[lib]
name = "mosaic_client_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
