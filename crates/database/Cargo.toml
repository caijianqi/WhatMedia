[package]
name = "whatmedia-database"
description = "SQLx 数据访问与 migration（唯一允许写 SQL 的 crate）"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[features]
openapi = ["dep:utoipa", "whatmedia-core/openapi"]

[dependencies]
utoipa = { workspace = true, optional = true }
whatmedia-core = { workspace = true }
whatmedia-config = { workspace = true }
# 直播的频道/节目草稿类型来自 crates/live（repo 只消费它的类型，不写解析逻辑）。
whatmedia-live = { workspace = true }
sqlx = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
chrono = { workspace = true }
uuid = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
async-trait = { workspace = true }
tokio = { workspace = true }

[dev-dependencies]
tokio = { workspace = true }
