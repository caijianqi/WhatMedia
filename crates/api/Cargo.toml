[package]
name = "whatmedia-api"
description = "Axum 路由层，唯一对外出口"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[features]
# 打开后才编译 utoipa 的 schema/path 标注与 `openapi.rs`。
# 默认关闭：常规构建不该为此付出编译时间。
openapi = [
  "dep:utoipa",
  "whatmedia-auth/openapi",
  "whatmedia-core/openapi",
  "whatmedia-database/openapi",
  "whatmedia-diagnostics/openapi",
  "whatmedia-metadata/openapi",
  "whatmedia-scanner/openapi",
  "whatmedia-aggregator/openapi",
]

[dependencies]
utoipa = { workspace = true, optional = true }
whatmedia-ai = { workspace = true }
whatmedia-auth = { workspace = true }
whatmedia-core = { workspace = true }
whatmedia-live = { workspace = true }
whatmedia-aggregator = { workspace = true }
async-trait = { workspace = true }
# 拉取 M3U 订阅 / XMLTV 节目单。直播是少数需要主动出站的端点。
reqwest = { workspace = true }
# DbHost 直接写 SQL（AI 的查询谓词太多，全下推会让查询不可维护），
# 所以这里需要 sqlx 本身，而不只是通过 whatmedia-database 间接拿到。
sqlx = { workspace = true }
anyhow = { workspace = true }
whatmedia-config = { workspace = true }
whatmedia-database = { workspace = true }
whatmedia-diagnostics = { workspace = true }
whatmedia-media = { workspace = true }
whatmedia-metadata = { workspace = true }
whatmedia-playback = { path = "../playback" }
whatmedia-storage = { workspace = true }
whatmedia-transcoder = { path = "../transcoder" }
whatmedia-scanner = { workspace = true }
axum = { workspace = true }
tower = { workspace = true }
tower-http = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
tokio-stream = { version = "0.1", features = ["sync"] }
tracing = { workspace = true }
chrono = { workspace = true }
uuid = { workspace = true }

[dev-dependencies]
whatmedia-auth = { workspace = true }
tower = { workspace = true, features = ["util"] }
tempfile = { workspace = true }
sqlx = { workspace = true }
serde_json = { workspace = true }
